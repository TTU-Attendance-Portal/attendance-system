<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal | TTU Attendance</title>
    
    <!-- PWA / App Mode Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#004085">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ttu-blue: #004085; --ttu-gold: #ffc107; --bg: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        .header { background: var(--ttu-blue); color: white; padding: 1.2rem; text-align: center; border-bottom: 4px solid var(--ttu-gold); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        h2 { color: var(--ttu-blue); margin: 0 0 0.5rem; font-size: 1.3rem; }
        p { color: #64748b; font-size: 0.85rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.9rem; border: 1px solid #e2e8f0; border-radius: 0.7rem; box-sizing: border-box; font-size: 16px; transition: all 0.2s; }
        input:focus { border-color: var(--ttu-blue); outline: none; box-shadow: 0 0 0 3px rgba(0,64,133,0.1); }
        
        /* Auto Caps & Validation Styling for Index input */
        #index { text-transform: uppercase; }
        #index.invalid { border-color: #dc2626; }
        #index.valid { border-color: #16a34a; }
        .error-msg { color: #dc2626; font-size: 0.75rem; font-weight: 600; margin-top: 0.4rem; display: none; }

        .btn-submit { width: 100%; padding: 1rem; border: none; border-radius: 0.7rem; background: var(--ttu-blue); color: white; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status-msg { margin-top: 1.5rem; padding: 0.8rem; border-radius: 0.6rem; font-size: 0.8rem; font-weight: 600; text-align: center; }
        .error { background: #fef2f2; color: #dc2626; }
        .success { background: #f0fdf4; color: #16a34a; }
        .footer { padding: 1.5rem; text-align: center; font-size: 0.7rem; color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>

<div class="header"><h1>Department Of Mechanical Engineering</h1></div>

<div class="container">
    <div class="card" id="main-content">
        <h2 id="class-title">Verifying Session...</h2>
        <p>Enter your academic details to sign in.</p>
        
        <div class="form-group">
            <label>Full Student Name</label>
            <input type="text" id="name" placeholder="eg. John Mensah" required>
        </div>

        <div class="form-group">
            <label>Index Number</label>
            <input 
                type="text" 
                id="index" 
                placeholder="eg. DP/CEA/24/112" 
                maxlength="13" 
                autocomplete="off" 
                required
            >
            <div id="index-error" class="error-msg">Invalid format. Must match eg. DP/CEA/24/112</div>
        </div>

        <button id="submit-btn" class="btn-submit" onclick="submitAttendance()" disabled>Verifying Location...</button>
        <div id="status-msg" class="error">⏳ Initializing Secure GPS...</div>
    </div>
</div>

<div class="footer">OFFICIAL TTU ATTENDANCE PORTAL<br>&copy; 2026 Department of Mechanical Engineering</div>

<script>
    // INDEX NUMBER AUTO-FORMATTING & VALIDATION
    const indexInput = document.getElementById('index');
    const indexError = document.getElementById('index-error');
    // Strictly requires: 2 Letters / 3 Letters / 2 Numbers / exactly 3 Numbers
    const indexPattern = /^[A-Z]{2}\/[A-Z]{3}\/\d{2}\/\d{3}$/;

    indexInput.addEventListener('input', function (e) {
        if (e.inputType === 'deleteContentBackward') {
            validateIndex();
            return;
        }

        let raw = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        let formatted = '';

        for (let i = 0; i < raw.length && formatted.length < 13; i++) {
            let char = raw[i];
            let count = formatted.replace(/\//g, '').length;

            if (count < 2) {
                if (/[A-Z]/.test(char)) formatted += char;
            } else if (count < 5) {
                if (formatted.length === 2) formatted += '/';
                if (/[A-Z]/.test(char)) formatted += char;
            } else if (count < 7) {
                if (formatted.length === 6) formatted += '/';
                if (/[0-9]/.test(char)) formatted += char;
            } else if (count < 10) {
                // Last part: exactly 3 figures
                if (formatted.length === 9) formatted += '/';
                if (/[0-9]/.test(char)) formatted += char;
            }
        }

        this.value = formatted;
        validateIndex();
    });

    indexInput.addEventListener('blur', function () {
        if (this.value.trim() !== '') {
            validateIndex(true);
        }
    });

    function validateIndex(showError = false) {
        const val = indexInput.value.trim();
        if (indexPattern.test(val)) {
            indexInput.classList.remove('invalid');
            indexInput.classList.add('valid');
            indexError.style.display = 'none';
            return true;
        } else {
            indexInput.classList.remove('valid');
            if (showError || val.length === 13) {
                indexInput.classList.add('invalid');
                indexError.style.display = 'block';
            } else {
                indexInput.classList.remove('invalid');
                indexError.style.display = 'none';
            }
            return false;
        }
    }
</script>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

    const params = new URLSearchParams(window.location.search);
    const classId = params.get('class') || 'none';
    const today = new Date().toISOString().split('T')[0];

    // Hardware ID (Anti-Cheat)
    function getHardwareID() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = "top"; ctx.font = "12px 'Arial'";
        ctx.fillText("TTU_SEC_ID", 2, 2);
        return btoa(canvas.toDataURL());
    }
    const deviceId = getHardwareID();

    async function init() {
        if (classId === 'none') {
            document.getElementById('main-content').innerHTML = `
                <h2>❌ Invalid Link</h2>
                <p>No class was specified. Please scan the official lecturer QR code.</p>
            `;
            return;
        }

        const { data, error } = await supabase.from('classes').select('name, expires_at').eq('id', classId).single();
        if (error || !data) {
            document.getElementById('class-title').innerText = "Class Not Found";
            return;
        }

        document.getElementById('class-title').innerText = data.name || "Attendance Sign-in";
        
        // 1. CHECK IF TIME EXPIRED
        if (data.expires_at) {
            const isExpired = new Date() > new Date(data.expires_at);
            if (isExpired) {
                document.getElementById('main-content').innerHTML = `
                    <h2>⛔ Attendance Closed</h2>
                    <p>The time limit for this attendance session has expired.</p>
                `;
                return;
            }
        }

        // 2. CHECK IF DEVICE ALREADY SIGNED IN
        const { data: lock } = await supabase.from('attendance').select('id').eq('device_id', deviceId).eq('class_id', classId).gte('created_at', today + 'T00:00:00Z');
        if (lock?.length > 0) {
            document.getElementById('main-content').innerHTML = "<h2>✅ Verified</h2><p>Attendance already recorded for today.</p>";
        }
    }
    init();

    let sLat, sLng;
    const status = document.getElementById('status-msg');
    const btn = document.getElementById('submit-btn');

    navigator.geolocation.watchPosition(async (pos) => {
        sLat = pos.coords.latitude; 
        sLng = pos.coords.longitude;

        if (classId === 'none') {
            if (status) { status.innerText = "❌ Please scan the QR code to sign in."; status.className = "error"; }
            if (btn) btn.innerText = "Invalid Link";
            return;
        }

        const { data: loc, error } = await supabase.from('classes').select('*').eq('id', classId).single();
        
        if (error || !loc) {
            if (status) { status.innerText = "❌ Class not found in database."; status.className = "error"; }
            if (btn) btn.innerText = "Class Not Found";
            return;
        }

        // If lecturer hasn't clicked "Sync Room GPS" yet
        if (!loc.lat || !loc.lng) {
            if (status) { status.innerText = "⚠️ Lecturer has not set Room GPS yet!"; status.className = "error"; }
            if (btn) { btn.disabled = true; btn.innerText = "Awaiting Room GPS..."; }
            return;
        }

        const dist = getDist(sLat, sLng, loc.lat, loc.lng);
        if (status && btn) {
            if (dist <= 0.1) { // 100m
                status.innerText = "📍 Location Verified"; 
                status.className = "success";
                btn.disabled = false; 
                btn.innerText = "Confirm Attendance";
            } else {
                status.innerText = `❌ Outside Range (${Math.round(dist * 1000)}m away)`; 
                status.className = "error";
                btn.disabled = true; 
                btn.innerText = "Out of Range";
            }
        }
    }, (err) => {
        if (!status || !btn) return;
        if (err.code === 1) {
            status.innerText = "❌ Location permission denied. Please allow GPS access in your browser settings.";
        } else if (err.code === 2) {
            status.innerText = "❌ Position unavailable. Ensure your device's Location is ON.";
        } else {
            status.innerText = "❌ GPS request timed out. Please try again.";
        }
        status.className = "error";
        btn.disabled = true;
        btn.innerText = "GPS Error";
    }, { enableHighAccuracy: true, timeout: 15000 });

    function getDist(la1, lo1, la2, lo2) {
        const R = 6371; const dLat = (la2-la1)*Math.PI/180; const dLon = (lo2-lo1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    window.submitAttendance = async () => {
        const name = document.getElementById('name').value.trim();
        const index = document.getElementById('index').value.trim();

        if(!name) return alert("Please enter your full name.");
        
        // Strict verification: Reject if index format is incorrect
        const indexPattern = /^[A-Z]{2}\/[A-Z]{3}\/\d{2}\/\d{3}$/;
        if (!indexPattern.test(index)) {
            document.getElementById('index').classList.add('invalid');
            document.getElementById('index-error').style.display = 'block';
            document.getElementById('index').focus();
            return alert("Invalid Index Number! Format must be like: DP/CEA/24/112");
        }

        // 1. Double check expiration before inserting (in case timer ran out while typing)
        const { data: classCheck } = await supabase.from('classes').select('expires_at').eq('id', classId).single();
        if (classCheck?.expires_at && new Date() > new Date(classCheck.expires_at)) {
            document.getElementById('main-content').innerHTML = `
                <h2>⛔ Attendance Closed</h2>
                <p>The time limit for this attendance session has expired.</p>
            `;
            return alert("Time's up! The attendance session has expired.");
        }

        // 2. Check if student already signed in today
        const { data: check } = await supabase.from('attendance').select('id').eq('index_number', index).eq('class_id', classId).gte('created_at', today + 'T00:00:00Z');
        if (check?.length > 0) return alert("Index number already signed in!");

        // 3. Save attendance
        const { error } = await supabase.from('attendance').insert([{ student: name, index_number: index, class_id: classId, lat: sLat, lng: sLng, device_id: deviceId }]);
        if (!error) document.getElementById('main-content').innerHTML = "<h2>✅ Success</h2><p>Attendance record secured.</p>";
    };
</script>
</body>
</html>
