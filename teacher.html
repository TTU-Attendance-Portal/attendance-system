<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Admin | TTU Attendance Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --ttu-blue: #004085; --ttu-gold: #ffc107; --bg: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 1.2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.06); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: var(--ttu-blue); margin-top: 0; }
        label { display: block; text-align: left; font-size: 0.8rem; font-weight: bold; color: #475569; margin: 12px 0 6px; }
        select, button { width: 100%; padding: 0.85rem; border-radius: 0.6rem; font-size: 1rem; box-sizing: border-box; }
        select { border: 1px solid #cbd5e1; margin-bottom: 10px; }
        .btn-start { background: var(--ttu-blue); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-close { background: #dc2626; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }
        #timer-box { margin-top: 15px; font-size: 1.2rem; font-weight: bold; color: #dc2626; display: none; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        .status { padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-top: 10px; font-weight: 600; }
        .info { background: #e0f2fe; color: #0369a1; }
        .success { background: #f0fdf4; color: #16a34a; }
    </style>
</head>
<body>

<div class="card">
    <h2>Lecturer Control Panel</h2>
    <p style="font-size: 0.85rem; color: #64748b;">Set GPS and time duration for students to scan.</p>

    <label>1. Select Class</label>
    <select id="class-select">
        <option value="">-- Choose Class --</option>
    </select>

    <label>2. Attendance Duration</label>
    <select id="duration-select">
        <option value="5">5 Minutes</option>
        <option value="10" selected>10 Minutes</option>
        <option value="15">15 Minutes</option>
        <option value="20">20 Minutes</option>
        <option value="30">30 Minutes</option>
    </select>

    <button id="start-btn" class="btn-start" onclick="openAttendanceSession()">📍 Capture GPS & Open Session</button>
    <button id="close-btn" class="btn-close" onclick="closeAttendanceSession()">🛑 End Attendance Early</button>

    <div id="status" class="status info">Ready to initialize</div>
    <div id="timer-box">⏳ Time Left: <span id="time-left">00:00</span></div>

    <!-- QR Code container for students to scan -->
    <div id="qrcode"></div>
    <div id="student-link" style="word-break: break-all; font-size: 0.8rem; color: #0284c7;"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

    let countdownInterval;

    // Load available classes from Supabase
    async function loadClasses() {
        const { data, error } = await supabase.from('classes').select('id, name');
        if (data) {
            const select = document.getElementById('class-select');
            data.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.innerText = c.name;
                select.appendChild(opt);
            });
        }
    }
    loadClasses();

    window.openAttendanceSession = function() {
        const classId = document.getElementById('class-select').value;
        const minutes = parseInt(document.getElementById('duration-select').value);
        const status = document.getElementById('status');

        if (!classId) return alert("Please select a class first!");

        status.innerText = "Acquiring your GPS location...";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            // Calculate expiration time (current time + selected minutes)
            const expiresAt = new Date(Date.now() + minutes * 60 * 1000).toISOString();

            // Update database with lecturer's GPS and expiration time
            const { error } = await supabase.from('classes').update({
                lat: lat,
                lng: lng,
                expires_at: expiresAt
            }).eq('id', classId);

            if (error) {
                alert("Error updating class: " + error.message);
                return;
            }

            status.innerText = `✅ Session active for ${minutes} minutes!`;
            status.className = "status success";

            // Generate Student URL and QR code
            // Change "student.html" to the actual name/URL of your student page
            const studentUrl = `${window.location.origin}/student.html?class=${classId}`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 180,
                height: 180
            });
            document.getElementById('student-link').innerText = studentUrl;

            // Start Live Countdown
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('close-btn').style.display = "block";
            startCountdown(expiresAt);

        }, (err) => {
            alert("Could not access GPS. Please enable location permissions.");
        }, { enableHighAccuracy: true });
    };

    function startCountdown(expiresAtIso) {
        const timerBox = document.getElementById('timer-box');
        const timeLeftSpan = document.getElementById('time-left');
        timerBox.style.display = 'block';

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            const diff = new Date(expiresAtIso).getTime() - Date.now();
            if (diff <= 0) {
                clearInterval(countdownInterval);
                timeLeftSpan.innerText = "EXPIRED";
                document.getElementById('status').innerText = "🛑 Attendance window has closed.";
                document.getElementById('close-btn').style.display = "none";
                document.getElementById('start-btn').style.display = "block";
                return;
            }

            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            timeLeftSpan.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    window.closeAttendanceSession = async function() {
        const classId = document.getElementById('class-select').value;
        if (!confirm("Are you sure you want to end attendance now?")) return;

        // Set expires_at to right now
        await supabase.from('classes').update({ expires_at: new Date().toISOString() }).eq('id', classId);
        clearInterval(countdownInterval);
        document.getElementById('timer-box').style.display = "none";
        document.getElementById('close-btn').style.display = "none";
        document.getElementById('start-btn').style.display = "block";
        document.getElementById('status').innerText = "Session ended manually.";
    };
</script>

</body>
</html>
